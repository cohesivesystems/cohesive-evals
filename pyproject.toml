[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cohesive-evals"
version = "0.1.0"
description = "Independent evaluation orchestration and scenario adapters"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
cohesive-evals = "cohesive_evals.__main__:main"

[tool.setuptools.packages.find]
include = ["cohesive_evals*"]
